name: SFRA synthetic gold benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/sfra-gold-benchmark.yml"
      - "GPT/Нейросеть/Проекты/Аналитик 1/Сессия 4/Issue 41/**"
      - "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация/**"
      - "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 2/Benchmark/**"
      - "GPT/Нейросеть/Проекты/Исполнитель 2/Сессия 1/Реализация/source/**"
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап Б1/**"
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1/**"

permissions:
  contents: read

concurrency:
  group: sfra-gold-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-e2-e3-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository source only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validator and existing SFRA packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema[format]==4.25.1"
          python -m pip install \
            "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация" \
            "GPT/Нейросеть/Проекты/Исполнитель 2/Сессия 1/Реализация/source" \
            "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап Б1" \
            "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1"
          python -m pip install "pytest==8.4.2"

      - name: Run benchmark preflight tests
        run: >-
          python -m pytest -q
          "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 2/Benchmark/test_runner.py"

      - name: Run synthetic end-to-end benchmark
        env:
          BENCHMARK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BENCHMARK_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BENCHMARK_CHECKOUT_SHA: ${{ github.sha }}
          BENCHMARK_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 2/Benchmark/runner.py"
          --output-dir benchmark-output

      - name: Upload synthetic benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfra-synthetic-gold-benchmark
          path: benchmark-output/
          if-no-files-found: ignore
          retention-days: 14
