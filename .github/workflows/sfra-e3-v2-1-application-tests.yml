name: SFRA E3 V2.1 application service tests

on:
  push:
    branches:
      - executor-3/v2-1-application-services
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап Б1/**"
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1/**"
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В2.1/**"
      - ".github/workflows/sfra-e3-v2-1-application-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап Б1/**"
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1/**"
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В2.1/**"
      - ".github/workflows/sfra-e3-v2-1-application-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install B1, E3 application package and real E2 runtime
        shell: bash
        run: |
          B1_DIR="GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап Б1"
          E3_DIR="GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1"
          E2_DIR="GPT/Нейросеть/Проекты/Исполнитель 2/Сессия 1/Реализация/source"
          python -m pip install --upgrade pip
          python -m pip install -e "$B1_DIR"
          python -m pip install -e "$E3_DIR[test]"
          python -m pip install -e "$E2_DIR"

      - name: Run B1 regression suite
        run: |
          B1_DIR="GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап Б1"
          python -m pytest -q "$B1_DIR/tests"

      - name: Run C1 adapter and integration contract suite
        run: |
          E3_DIR="GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1"
          python -m pytest -q "$E3_DIR/tests"

      - name: Run V2.1 application service contract suite
        run: |
          TEST_DIR="GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В2.1/tests"
          python -m pytest -q "$TEST_DIR"

      - name: Verify application package has no transport dependencies
        run: |
          python - <<'PY'
          from importlib.metadata import requires

          forbidden = ("github", "PyGithub", "fastapi", "starlette", "flask", "mcp")
          requirements = requires("sfra-context-integrations") or []
          found = [
              item for item in requirements
              if any(token.lower() in item.lower() for token in forbidden)
          ]
          if found:
              raise SystemExit("V2.1 must remain transport-independent: " + ", ".join(found))
          print("No GitHub, HTTP-server, or MCP dependencies declared.")
          PY
