name: Append project session registry

on:
  push:
    branches:
      - main
    paths:
      - 'GPT/Нейросеть/Проекты/*/.append-queue/*.md'

permissions:
  contents: read

jobs:
  identify_project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project_dir: ${{ steps.detect.outputs.project_dir }}
    steps:
      - name: Detect the project from the incoming queue fragment
        id: detect
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          before = os.environ["BEFORE_SHA"]
          after = os.environ["AFTER_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/compare/{before}...{after}"
          request = Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=30) as response:
              comparison = json.load(response)

          pattern = re.compile(
              r"^(GPT/Нейросеть/Проекты/[^/]+)/\.append-queue/[^/]+\.md$"
          )
          projects = set()
          for changed_file in comparison.get("files", []):
              if changed_file.get("status") != "added":
                  continue
              match = pattern.fullmatch(changed_file.get("filename", ""))
              if match:
                  projects.add(match.group(1))

          if len(projects) != 1:
              raise SystemExit(
                  "Expected exactly one project queue path in this push; "
                  f"found: {sorted(projects)}"
              )

          project_dir = projects.pop()
          if "\n" in project_dir or "\r" in project_dir:
              raise SystemExit("Invalid project path")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"project_dir={project_dir}\n")
          print(f"Queue request belongs to: {project_dir}")
          PY

  append:
    needs: identify_project
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: append-project-session-registry-${{ needs.identify_project.outputs.project_dir }}
      queue: max
    steps:
      - name: Check out only the selected project
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: ${{ needs.identify_project.outputs.project_dir }}
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Append queued fragments and commit
        shell: bash
        env:
          PROJECT_DIR: ${{ needs.identify_project.outputs.project_dir }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            : > "$RUNNER_TEMP/registry-path"
            python - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          expected_parent = Path("GPT/Нейросеть/Проекты")
          if (
              len(project.parts) != 4
              or project.parts[:3] != expected_parent.parts
              or project.name in {".", ".."}
              or project.resolve().parent != expected_parent.resolve()
          ):
              raise SystemExit(f"Refusing unexpected project path: {project}")
          if not project.is_dir() or project.is_symlink():
              raise SystemExit(f"Project directory is missing or unsafe: {project}")

          queue_dir = project / ".append-queue"
          if not queue_dir.exists():
              print("No pending queue directory.")
              raise SystemExit(0)
          if queue_dir.is_symlink() or not queue_dir.is_dir():
              raise SystemExit(f"Queue path is not a regular directory: {queue_dir}")

          fragments = sorted(queue_dir.glob("*.md"), key=lambda path: path.name)
          if not fragments:
              print("No pending session fragments.")
              raise SystemExit(0)

          sessions = []
          for candidate in project.iterdir():
              match = re.fullmatch(r"Сессия (\d+)", candidate.name)
              if match and candidate.is_dir() and not candidate.is_symlink():
                  sessions.append((int(match.group(1)), candidate))
          if not sessions:
              raise SystemExit(f"No numbered session directory in {project}")

          session_dir = max(sessions, key=lambda item: item[0])[1]
          registry = session_dir / "Реестр Сессии.md"
          if not registry.is_file() or registry.is_symlink():
              raise SystemExit(f"Session registry is missing or unsafe: {registry}")

          # The append script never opens the registry for reading.
          # Git handles the local file bytes when preparing the commit.
          has_existing_content = registry.stat().st_size > 0
          with registry.open("ab") as destination:
              for fragment in fragments:
                  if fragment.is_symlink() or not fragment.is_file():
                      raise SystemExit(f"Invalid queue fragment: {fragment}")
                  if not re.fullmatch(r"\d{8}T\d{9}Z-[A-Za-z0-9_-]+\.md", fragment.name):
                      raise SystemExit(f"Queue fragment has an invalid name: {fragment.name}")
                  data = fragment.read_bytes()
                  if not data:
                      raise SystemExit(f"Queue fragment is empty: {fragment}")
                  data.decode("utf-8")

                  if has_existing_content:
                      destination.write(b"\n")
                  destination.write(data)
                  if not data.endswith(b"\n"):
                      destination.write(b"\n")
                  has_existing_content = True
                  fragment.unlink()
                  print(f"Appended and consumed: {fragment.name}")

          print(f"Updated registry: {registry}")
          target_path_file = Path(os.environ["RUNNER_TEMP"]) / "registry-path"
          target_path_file.write_text(registry.as_posix(), encoding="utf-8")
          PY

            if [[ ! -s "$RUNNER_TEMP/registry-path" ]]; then
              echo "No queued fragments needed processing."
              exit 0
            fi
            REGISTRY_PATH="$(cat "$RUNNER_TEMP/registry-path")"
            git add -- "$REGISTRY_PATH"
            git add -u -- "$PROJECT_DIR/.append-queue"
            if git diff --cached --quiet; then
              echo "No queued fragments needed processing."
              exit 0
            fi

            git commit -m "Append project session registry"
            if git push origin HEAD:main; then
              echo "Session registry append committed successfully."
              exit 0
            fi

            echo "Push raced with a new commit; refreshing main and retrying (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
          done

          echo "Could not push the session registry update after 5 attempts." >&2
          exit 1
