name: SFRA structural indexer stages B and C

on:
  push:
    branches:
      - executor-1/sfra-indexer-session-1
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация/**"
      - ".github/workflows/sfra-stage-b-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация/**"
      - ".github/workflows/sfra-stage-b-tests.yml"

# PR/push CI is fixture-only. It must never checkout ГП or sfra-state and must
# never index repository Vault content. Real-state maintenance is separate and
# requires an explicit operational action through sfra-state-persistence.yml.

permissions:
  contents: read

concurrency:
  group: sfra-e1-fixture-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  structural-indexer-tests:
    name: E1 isolated unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация"
    steps:
      - name: Check out implementation under test without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация/pyproject.toml"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt

      - name: Run complete E1 unit and contract suite against temporary fixtures
        run: python -m pytest -q --junitxml "$RUNNER_TEMP/e1-fixture-tests.xml"

      - name: Check CLI entry point
        run: sfra-index --help >/dev/null

      - name: Assert fixture-only workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/sfra-stage-b-tests.yml")
          # Ignore YAML comments; only executable workflow content is scanned.
          executable = "\n".join(
              line.split("#", 1)[0]
              for line in path.read_text(encoding="utf-8").splitlines()
          )
          forbidden = {
              "real index command": r"\bsfra-index\s+index\b",
              "production state ref": r"(?m)^\s*ref:\s*sfra-state\s*$",
              "Vault sparse checkout": r"(?m)^\s*sparse-checkout:\s*ГП\s*$",
              "production state checkout path": r"(?m)^\s*path:\s*(_state_source|production-state-source|state-repo|vault)\s*$",
          }
          failures = [name for name, pattern in forbidden.items() if re.search(pattern, executable)]
          if failures:
              raise SystemExit("Forbidden fixture-CI configuration: " + ", ".join(failures))
          print("Fixture-only boundary verified: no production checkout or index command.")
          PY
