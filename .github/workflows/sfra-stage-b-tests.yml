name: SFRA structural indexer stage B

on:
  push:
    branches:
      - executor-1/sfra-indexer-session-1
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация/**"
      - ".github/workflows/sfra-stage-b-tests.yml"

jobs:
  stage-b-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt
      - name: Run stage-B test suite
        run: python -m pytest
      - name: Check CLI
        run: sfra-index --help
      - name: Parse the real repository Vault snapshot
        run: |
          sfra-index index --vault ../../../../../../ГП --index-dir /tmp/sfra-vault-sidecar
          sfra-index info --db /tmp/sfra-vault-sidecar/structure.sqlite3
