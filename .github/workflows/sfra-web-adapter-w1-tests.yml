name: SFRA Web adapter W1 fixture tests

on:
  pull_request:
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап W1/**"
      - ".github/workflows/sfra-web-adapter-w1-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install isolated package and test dependency
        working-directory: "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап W1"
        run: python -m pip install -e ".[test]"
      - name: Run fixture-only adapter tests
        working-directory: "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап W1"
        run: python -m pytest -q
