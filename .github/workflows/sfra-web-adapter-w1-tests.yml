name: SFRA Web adapter W1 synthetic worker

on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап W1/**"
      - ".github/workflows/sfra-web-adapter-w1-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sfra-web-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  fixture-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SFRA core and isolated adapter
        run: |
          python -m pip install \
            -e "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап Б1" \
            -e "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1" \
            -e "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В2.2" \
            -e "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап W1[test]"
      - name: Run fixture-only adapter tests
        working-directory: "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап W1"
        run: python -m pytest -q

  synthetic-issue-worker:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.repository == 'yeatu/obsidianGP' &&
      github.event.issue.user.login == 'yeatu' &&
      startsWith(github.event.issue.title, '[SFRA]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install transport-independent SFRA core and Web adapter
        run: |
          python -m pip install \
            "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап Б1" \
            "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1" \
            "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В2.2" \
            "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап W1"
      - name: Process one synthetic-only SFRA request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: python -m sfra_web_adapter.runner
