name: SFRA issue bridge smoke test

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  bridge-smoke:
    if: >-
      github.event.issue.user.login == 'yeatu' &&
      startsWith(github.event.issue.title, '[SFRA-BRIDGE-TEST]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Validate probe and post a machine-readable reply
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          expected = "SFRA_BRIDGE_PROBE=1"
          author = os.environ["ISSUE_AUTHOR"]
          title = os.environ["ISSUE_TITLE"]
          payload_lines = (os.environ.get("ISSUE_BODY") or "").splitlines()
          payload_ok = any(line.strip() == expected for line in payload_lines)

          status = "SFRA_BRIDGE_OK"
          details = [
              "- Issue trigger: received",
              "- Workflow runner: executed",
              "- GitHub token: available with issues:write",
          ]

          if author != "yeatu":
              status = "SFRA_BRIDGE_REJECTED"
              details.append("- Author check: failed")
          elif not title.startswith("[SFRA-BRIDGE-TEST]"):
              status = "SFRA_BRIDGE_REJECTED"
              details.append("- Title check: failed")
          elif not payload_ok:
              status = "SFRA_BRIDGE_BAD_PAYLOAD"
              details.append("- Payload check: failed")
          else:
              details.append("- Payload check: passed")

          comment = "\n".join([
              status,
              "",
              *details,
              f"- Workflow run: {os.environ['RUN_ID']}",
              "",
              "This is a transport smoke test. No Vault contents were read or copied.",
          ])

          api_url = os.environ["API_URL"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          url = f"{api_url}/repos/{repository}/issues/{issue_number}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({"body": comment}).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
              print(f"Posted smoke-test comment: {result.get('html_url', 'created')}")
          if status != "SFRA_BRIDGE_OK":
              raise SystemExit(status)
          PY
