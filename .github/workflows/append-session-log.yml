name: Append session log fragments

on:
  push:
    branches:
      - main
    paths:
      - "session-log-inbox/*.md"

permissions:
  contents: write

concurrency:
  group: append-session-log
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append incoming entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          inbox = Path("session-log-inbox")
          target = Path("Оценка системы магии/История сессии.txt")
          fragments = sorted(inbox.glob("*.md"))

          if not fragments:
              print("No session-log fragments found.")
              raise SystemExit(0)

          target.parent.mkdir(parents=True, exist_ok=True)
          with target.open("ab") as journal:
              existing = target.read_bytes()
              if existing and not existing.endswith(b"\n"):
                  journal.write(b"\n")

              for fragment in fragments:
                  data = fragment.read_bytes()
                  if not data:
                      raise ValueError(f"Refusing to append empty fragment: {fragment}")
                  journal.write(data)
                  if not data.endswith(b"\n"):
                      journal.write(b"\n")
                  print(f"Appended {fragment}")
                  fragment.unlink()
          PY

      - name: Commit journal update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Оценка системы магии/История сессии.txt" session-log-inbox
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Append session log entries"
          git push origin HEAD:main
