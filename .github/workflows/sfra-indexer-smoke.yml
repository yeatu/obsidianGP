name: sfra-indexer-smoke

on:
  push:
    branches:
      - sfra/indexer-v1

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SFRA tests
        run: python -m unittest discover -s tests -v
