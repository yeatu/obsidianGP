name: SFRA E3 snapshot writer fixture tests

on:
  push:
    branches:
      - "executor-3/issue-125-snapshot-writer"
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1/src/sfra_context_integrations/cloud_snapshot_writer.py"
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1/tests/test_cloud_snapshot_writer.py"
      - "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1/CLOUD_SNAPSHOT_WRITER.md"
      - ".github/workflows/sfra-e3-snapshot-writer-tests.yml"

permissions:
  contents: read

jobs:
  snapshot-writer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1/pyproject.toml"
      - name: Install E1 indexer, B1, E3 and E2 fixture dependencies
        shell: bash
        run: |
          E1_DIR="GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация"
          B1_DIR="GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап Б1"
          E3_DIR="GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1"
          E2_DIR="GPT/Нейросеть/Проекты/Исполнитель 2/Сессия 1/Реализация/source"
          python -m pip install --upgrade pip
          python -m pip install -e "$E1_DIR"
          python -m pip install -e "$B1_DIR"
          python -m pip install -e "$E3_DIR[test]"
          python -m pip install -e "$E2_DIR"
      - name: Run synthetic immutable writer tests
        run: |
          E3_DIR="GPT/Нейросеть/Проекты/Исполнитель 3/Сессия 1/Реализация/Этап В1"
          python -m pytest -q "$E3_DIR/tests/test_cloud_snapshot_writer.py"
