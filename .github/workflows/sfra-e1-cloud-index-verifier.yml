name: SFRA E1 cloud-index verifier fixture tests

on:
  push:
    branches:
      - executor-3/issue-257-cloud-verifier-corrections
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация/**"
      - ".github/workflows/sfra-e1-cloud-index-verifier.yml"
  pull_request:
    branches:
      - main
    paths:
      - "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация/**"
      - ".github/workflows/sfra-e1-cloud-index-verifier.yml"

# Synthetic fixtures only. This workflow never checks out a Vault or production
# state repository and never dispatches operational or persistence workflows.
permissions:
  contents: read

concurrency:
  group: sfra-e1-cloud-index-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verifier-tests:
    name: E1 cloud-index verifier and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация"
    steps:
      - name: Check out exact implementation under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "GPT/Нейросеть/Проекты/Исполнитель 1/Сессия 1/Реализация/pyproject.toml"

      - name: Install E1 package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt

      - name: Run focused cloud-index verifier contract tests
        run: python -m pytest -q tests/test_cloud_index_verifier.py

      - name: Run complete E1 regression suite
        run: python -m pytest -q --junitxml "$RUNNER_TEMP/e1-cloud-index-regression.xml"

      - name: Check CLI compatibility
        run: sfra-index --help >/dev/null
