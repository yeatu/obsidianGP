[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfra-structural-indexer"
version = "0.2.0"
description = "Stage-B source-preserving Markdown structural parser for SFRA"
requires-python = ">=3.10"
dependencies = ["markdown-it-py>=4.2.0,<5.0.0"]

[project.scripts]
sfra-index = "sfra_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sfra_indexer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
